<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>¿Se Te Perdió Algo? — UPA</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>¿Se Te Perdió Algo?</h1>
    <p class="subtitle">Objetos perdidos y encontrados en la UPA</p>
    <div class="header-actions">
      <input id="buscador" type="text" placeholder="Buscar por título, lugar o descripción..." />
      <button id="btnPublicar" class="btn-primary">+ Publicar</button>
    </div>
    <nav class="tabs">
      <button class="tab activo" data-tipo="">Todos</button>
      <button class="tab" data-tipo="Perdido">Perdidos</button>
      <button class="tab" data-tipo="Encontrado">Encontrados</button>
    </nav>
  </header>

  <main>
    <div id="grid" class="grid"></div>
    <p id="vacio" class="vacio oculto">Aún no hay publicaciones. ¡Sé el primero en publicar!</p>
  </main>

  <div id="modalPublicar" class="modal oculto">
    <div class="modal-contenido">
      <button class="cerrar" data-cerrar="modalPublicar">&times;</button>
      <h2>Publicar objeto</h2>
      <form id="formPublicar">
        <label>¿Qué pasó?
          <select name="tipo" required>
            <option value="Perdido">Perdí un objeto</option>
            <option value="Encontrado">Encontré un objeto</option>
          </select>
        </label>
        <label>Título
          <input type="text" name="titulo" placeholder="Ej. Mochila azul Jansport" required />
        </label>
        <label>Descripción
          <textarea name="descripcion" rows="3" placeholder="Detalles que ayuden a identificarlo..." required></textarea>
        </label>
        <label>Categoría
          <select name="categoria">
            <option>Electrónica</option>
            <option>Ropa</option>
            <option>Mochilas / Bolsas</option>
            <option>Documentos</option>
            <option>Llaves</option>
            <option>Otro</option>
          </select>
        </label>
        <label>Ubicación
          <input type="text" name="ubicacion" placeholder="Ej. Edificio B, cafetería" required />
        </label>
        <label>Tu nombre
          <input type="text" name="nombreContacto" required />
        </label>
        <label>Contacto (correo o teléfono)
          <input type="text" name="contacto" required />
        </label>
        <label>Fotos
          <input type="file" name="fotos" accept="image/*" multiple />
        </label>
        <div id="previewFotos" class="preview-fotos"></div>
        <button type="submit" class="btn-primary">Publicar</button>
      </form>
    </div>
  </div>

  <div id="modalDetalle" class="modal oculto">
    <div class="modal-contenido">
      <button class="cerrar" data-cerrar="modalDetalle">&times;</button>
      <div id="detalleContenido"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
